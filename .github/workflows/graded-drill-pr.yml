name: Graded DR Drill PR

on:
  pull_request:
    branches: [main]

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python3 -m pytest tests/test_failover.py -v

      - name: Baseline drill
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make seed
          bash scripts/up_bare.sh
          python3 loadgen/traffic.py --duration 40 --rps 2 --out reports/drill-1-nodr.jsonl &
          LOAD=$!
          sleep 8
          python3 chaos/kill_region.py --region a --mode netblock --mock
          wait "$LOAD"
          python3 tools/measure_rto.py --loadgen reports/drill-1-nodr.jsonl --target-rto 300 > reports/measure-drill-1.json
          python3 chaos/kill_region.py restore --region a --backend bare
          bash scripts/down_bare.sh

      - name: Reset stack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf state/region-a state/region-b state/_replica run
          make seed
          bash scripts/up_bare.sh

      - name: DR drill
        shell: bash
        run: |
          set -euo pipefail
          python3 state/ingest.py --region a --rate 0.5 --duration 120 &
          ING=$!
          python3 state/replicate.py --every 30 --duration 120 --backend fs &
          REP=$!
          sleep 5
          python3 loadgen/traffic.py --duration 100 --rps 2 --out reports/drill-2-withdr.jsonl &
          LOAD=$!
          python3 dr/health_checker.py --interval 5 --threshold 3 --duration 100 --out reports/health-events.jsonl &
          HC=$!
          sleep 12
          python3 chaos/kill_region.py --region a --mode netblock --mock
          python3 dr/runbook.py --primary a --target b --backend fs --auto > reports/runbook-output.log
          wait "$LOAD"
          wait "$HC"
          kill "$ING" "$REP" 2>/dev/null || true
          wait "$ING" 2>/dev/null || true
          wait "$REP" 2>/dev/null || true
          python3 tools/measure_rto.py --loadgen reports/drill-2-withdr.jsonl --target-rto 300 > reports/measure-drill-2.json

      - name: Raw grading gates
        run: |
          python3 - <<'PY'
          import json
          m1=json.load(open('reports/measure-drill-1.json'))
          m2=json.load(open('reports/measure-drill-2.json'))
          assert m1['valid'] and m1['rto_verdict']=='NO_RECOVERY', m1
          assert m2['valid'] and not m2['warnings'], m2
          assert m2['rto_verdict']=='PASS' and m2['recovered_by_region']=='b', m2
          assert m2['rpo_at_restore_s'] is not None and m2['docs_lost'] is not None, m2
          print(json.dumps({'drill1':m1,'drill2':m2}, indent=2))
          PY

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graded-dr-raw
          if-no-files-found: error
          path: |
            reports/drill-1-nodr.jsonl
            reports/drill-2-withdr.jsonl
            reports/health-events.jsonl
            reports/failover-events.jsonl
            reports/runbook-run.jsonl
            reports/replication.jsonl
            reports/measure-drill-1.json
            reports/measure-drill-2.json
            reports/runbook-output.log
            chaos/chaos-events.jsonl
